<title>Planløsning – tegn huset ditt i 2D og se det i 3D</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--line:#e3e7ee;--text:#1f2937;--muted:#6b7280;--accent:#2563eb;--accent2:#dbeafe;--danger:#dc2626;--wall:#374151;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;line-height:1.2;transition:background .12s,border-color .12s}
button:hover{background:#f3f4f6}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#1d4ed8}
button.danger{color:var(--danger)}
button.small{padding:3px 8px;font-size:12px}
input[type=text],input[type=number],select{border:1px solid var(--line);border-radius:7px;padding:5px 7px;background:#fff;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent2);border-color:var(--accent)}
#app{display:grid;grid-template-rows:52px 1fr 28px;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5;min-width:0}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#f9fafb}
.seg button{border:0;border-radius:0;padding:6px 12px;background:transparent}
.seg button.on{background:var(--accent);color:#fff}
.spacer{flex:1}
.grp{display:flex;gap:6px;align-items:center}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:250px;display:none;z-index:50}
.menu.open .menu-list{display:block}
.menu-list button{width:100%;border:0;justify-content:flex-start;padding:8px 10px}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#main{display:flex;min-height:0;position:relative}
#tools{width:72px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px 6px;gap:4px;overflow-y:auto}
#tools button{flex-direction:column;border:1px solid transparent;padding:7px 2px;font-size:11px;gap:3px;background:transparent;width:100%}
#tools button:hover{background:#f3f4f6}
#tools button.on{background:var(--accent2);border-color:#bfdbfe;color:#1e40af}
#tools .sep{height:1px;background:var(--line);margin:4px 2px}
#views{flex:1;display:flex;min-width:0;min-height:0;position:relative}
#view2d,#view3d{position:relative;min-width:0;min-height:0;flex:1;overflow:hidden}
#view3d{background:#dfe8f1;border-left:1px solid var(--line)}
#views.v-2d #view3d{display:none}
#views.v-3d #view2d{display:none}
#views.v-3d #view3d{border-left:0}
#c2d{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#view3d canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.float{position:absolute;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);backdrop-filter:blur(4px)}
#hint{left:12px;bottom:12px;padding:7px 11px;font-size:12.5px;color:#374151;max-width:calc(100% - 170px);pointer-events:none}
#zoomBox{right:12px;bottom:12px;display:flex;padding:3px;gap:3px}
#zoomBox button{border:0;padding:5px 9px}
#floorBadge{left:12px;top:12px;padding:5px 10px;font-weight:600;font-size:12.5px}
#ov3d{right:12px;top:12px;padding:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;max-width:calc(100% - 24px)}
#ov3d label{font-size:12px;display:flex;gap:4px;align-items:center;padding:0 4px}
#fpHelp{left:50%;bottom:14px;transform:translateX(-50%);padding:8px 14px;font-size:13px;display:none;text-align:center}
#crosshair{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;display:none;pointer-events:none}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#crosshair:before{left:6px;top:0;width:2px;height:14px}#crosshair:after{top:6px;left:0;height:2px;width:14px}
#no3d{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);padding:20px;text-align:center}
aside{width:310px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:4px 0 20px}
aside section{padding:12px 14px;border-bottom:1px solid var(--line)}
aside h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row.one{grid-template-columns:1fr}
.row.three{grid-template-columns:1fr 1fr 1fr}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.chk{display:flex;align-items:center;gap:7px;margin:5px 0;font-size:13px;cursor:pointer}
.info{font-size:12.5px;color:var(--muted);line-height:1.5}
.big{font-size:20px;font-weight:700;color:var(--text)}
.floor-item{display:grid;grid-template-columns:auto 1fr 74px auto;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer}
.floor-item.on{border-color:var(--accent);background:#f5f8ff}
.floor-item .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent)}
.floor-item.on .dot{background:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
input[type=range]{width:100%}
input[type=color]{width:100%;height:32px;border:1px solid var(--line);border-radius:7px;padding:2px;background:#fff}
footer{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
footer label{display:flex;gap:5px;align-items:center;cursor:pointer}
footer select{width:auto;padding:1px 4px;font-size:12px}
#modalWrap{position:fixed;inset:0;background:rgba(17,24,39,.35);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal{background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:18px;width:min(420px,100%)}
#modal h2{margin:0 0 8px;font-size:17px}
#modal p{margin:0 0 12px;color:var(--muted);line-height:1.45}
#modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:all .2s;pointer-events:none;z-index:200;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.only-narrow{display:none}
@media (max-width:1000px){
 aside{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:-8px 0 24px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .2s}
 aside.open{transform:none}
 .only-narrow{display:inline-flex}
 .hide-narrow{display:none!important}
}
@media (max-width:640px){
 #tools{width:56px}#tools button span{display:none}
 .brand span{display:none}
 header{gap:6px;padding:0 6px}
 #views.v-split{flex-direction:column}
 #views.v-split #view3d{border-left:0;border-top:1px solid var(--line)}
 footer .hide-mobile{display:none}
 #hint{display:none}
}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="brand"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Planløsning</span></div>
 <div class="seg" id="viewSeg"><button data-view="2d" title="Kun 2D-plan">2D</button><button data-view="split" title="2D og 3D side om side">Delt</button><button data-view="3d" title="Kun 3D">3D</button></div>
 <div class="grp"><button id="btnUndo" title="Angre (Ctrl+Z)">↶<span class="hide-narrow">Angre</span></button><button id="btnRedo" title="Gjør om (Ctrl+Y)">↷<span class="hide-narrow">Gjør om</span></button></div>
 <div class="spacer"></div>
 <div class="grp">
  <button id="btnExample" class="hide-narrow" title="Last inn et eksempelhus med to etasjer">Last inn eksempel</button>
  <button id="btnMyHouse" class="hide-narrow" title="Last inn huset ditt (Husbanken 089-74)">Mitt hus</button>
  <div class="menu" id="fileMenu"><button id="btnFile">Fil ▾</button>
   <div class="menu-list">
    <button data-act="new">🗋 Ny tegning</button>
    <button data-act="open">📂 Åpne prosjekt (JSON)…</button>
    <button data-act="save">💾 Lagre prosjekt (JSON)</button>
    <hr>
    <button data-act="png2d">🖼 Eksporter 2D-plan som PNG</button>
    <button data-act="png3d">📷 Eksporter 3D-bilde som PNG</button>
    <button data-act="glb">🧊 Eksporter 3D-modell (GLB)</button>
    <hr>
    <button data-act="example">🏡 Last inn eksempel</button>
    <button data-act="myhouse">🏠 Mitt hus (089-74)</button>
    <hr>
    <button data-act="help">❓ Hurtigtaster og hjelp</button>
   </div>
  </div>
  <button id="btnSidebar" class="only-narrow" title="Vis/skjul panel">☰</button>
 </div>
</header>
<div id="main">
 <nav id="tools"></nav>
 <div id="views" class="v-2d">
  <div id="view2d"><canvas id="c2d"></canvas>
   <div id="floorBadge" class="float"></div>
   <div id="hint" class="float"></div>
   <div id="zoomBox" class="float"><button id="zIn" title="Zoom inn">＋</button><button id="zOut" title="Zoom ut">－</button><button id="zFit" title="Tilpass til tegningen">⤢</button></div>
  </div>
  <div id="view3d">
   <div id="ov3d" class="float">
    <button id="btnWalk" class="small primary" title="Gå rundt i huset (WASD + mus)">🚶 Gå rundt</button>
    <button id="btnFit3d" class="small" title="Tilpass kamera">⤢ Tilpass</button>
    <label title="Vis bare aktiv etasje og etasjene under"><input type="checkbox" id="chkOnlyBelow"> Skjul etasjer over</label>
    <label title="Kutt veggene i 1,2 m høyde for å se inn"><input type="checkbox" id="chkLowWalls"> Lave vegger</label>
    <label><input type="checkbox" id="chkLabels3d" checked> Romnavn</label>
   </div>
   <div id="fpHelp" class="float"></div>
   <div id="crosshair"></div>
   <div id="no3d">3D-visning er ikke tilgjengelig i denne nettleseren (WebGL mangler).</div>
  </div>
 </div>
 <aside id="sidebar">
  <section id="secProps"></section>
  <section id="secFloors"></section>
  <section id="secBg"></section>
  <section id="secView"></section>
 </aside>
</div>
<footer>
 <span id="stCoords">x 0,00 · y 0,00 m</span>
 <label title="Fest punkter til rutenettet (G)"><input type="checkbox" id="chkSnap"> Fest til rutenett</label>
 <select id="selGrid" title="Rutenettets størrelse"><option value="0.01">1 cm</option><option value="0.05">5 cm</option><option value="0.1">10 cm</option><option value="0.25">25 cm</option><option value="0.5">50 cm</option><option value="1">1 m</option></select>
 <span id="stZoom" class="hide-mobile"></span>
 <span class="spacer"></span>
 <span id="stSave"></span>
</footer>
</div>
<div id="modalWrap"><div id="modal"></div></div>
<div id="toast"></div>
